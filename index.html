<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Game Tebak Kata Kamus Edisi Pelajar Interaktif - Baca definisi KBBI, raih Combo, naikkan Pangkat Pelajar, dan tebak katanya secepat mungkin!">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Tebak Kata Kamus — Edisi Pelajar Interaktif</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #070b14;
            --bg-card: #0f172a;
            --bg-card-glass: rgba(15, 23, 42, 0.90);
            --bg-surface: #1e293b;
            --bg-elevated: #334155;
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-medium: rgba(148, 163, 184, 0.24);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --correct-color: #22c55e;
            --wrong-color: #ef4444;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            padding-top: calc(8px + var(--safe-area-top));
            padding-bottom: calc(8px + var(--safe-area-bottom));
        }

        /* Background ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 25% 20%, rgba(59, 130, 246, 0.10) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            background: var(--bg-card-glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 22px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.65),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: calc(100dvh - 16px - var(--safe-area-top) - var(--safe-area-bottom));
            overflow-y: auto;
            overflow-x: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #app::-webkit-scrollbar { width: 5px; }
        #app::-webkit-scrollbar-track { background: transparent; }
        #app::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 10px; }

        #app.fever-active {
            border-color: rgba(245, 158, 11, 0.65);
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.28),
                        0 0 70px rgba(244, 63, 94, 0.15),
                        0 0 0 1px rgba(251, 191, 36, 0.3) inset;
        }

        @media (min-width: 640px) {
            #app {
                padding: 22px 28px;
                border-radius: 26px;
            }
        }

        /* ===== TOP PROGRESS BAR ===== */
        .timer-bar-wrap {
            width: 100%;
            height: 6px;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 999px;
            transition: width 0.35s linear, background 0.3s ease;
        }

        /* ===== STUDENT PROFILE BANNER ===== */
        .student-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--border-medium);
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .student-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .rank-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(139, 92, 246, 0.25));
            border: 1px solid rgba(96, 165, 250, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .rank-info h3 {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .rank-info p {
            font-size: 0.72rem;
            color: #93c5fd;
            font-weight: 600;
        }

        .student-stats-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 4px 9px;
            font-size: 0.72rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
        }

        .xp-bar-container {
            width: 100%;
            height: 7px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .daily-quest-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.73rem;
            color: #a7f3d0;
            font-weight: 600;
        }

        /* ===== TOPIC FILTER CHIPS ===== */
        .topic-section {
            width: 100%;
            margin-bottom: 12px;
        }

        .topic-label {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .topic-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .topic-chip {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 6px 11px;
            border-radius: 999px;
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .topic-chip:hover {
            border-color: var(--accent-blue);
            color: white;
        }

        .topic-chip.active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        /* ===== LETTER BOXES ===== */
        .letter-box {
            width: 2.05rem;
            height: 2.45rem;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 2px solid var(--border-medium);
            background: var(--bg-surface);
            text-transform: uppercase;
            transition: all 0.14s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
            user-select: none;
        }

        @media (min-width: 380px) {
            .letter-box {
                width: 2.25rem;
                height: 2.65rem;
                font-size: 1.2rem;
            }
        }

        @media (min-width: 640px) {
            .letter-box {
                width: 2.85rem;
                height: 3.15rem;
                font-size: 1.45rem;
                border-radius: 12px;
            }
        }

        .letter-box.active {
            border-color: var(--accent-blue);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.45), 0 0 4px rgba(59, 130, 246, 0.2) inset;
            transform: scale(1.08);
            background: rgba(30, 58, 138, 0.35);
        }

        .letter-box.correct {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-color: #4ade80;
            color: white;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }

        .letter-box.hinted {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-color: #fbbf24;
            color: white;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
        }

        .letter-box.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #f87171;
            color: white;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.45);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.24); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(4px); }
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.95); }
            100% { opacity: 0; transform: translateY(-34px) scale(1.25); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
            50% { box-shadow: 0 0 18px 4px rgba(239, 68, 68, 0.25); }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes emoji-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.14); }
        }

        .animate-pop { animation: pop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-shake { animation: shake 0.32s ease-in-out; }
        .animate-fade-in-up { animation: fadeInUp 0.38s ease-out; }

        .time-bonus {
            position: absolute;
            color: var(--accent-emerald);
            font-weight: 800;
            font-size: 1.1rem;
            animation: floatUp 0.95s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
            white-space: nowrap;
            z-index: 20;
        }

        .timer-critical {
            color: var(--wrong-color) !important;
            animation: pulse-glow 0.9s ease-in-out infinite;
            border-radius: 8px;
            padding: 1px 5px;
        }

        /* ===== VIRTUAL KEYBOARD ===== */
        .keyboard-container {
            width: 100%;
            max-width: 580px;
            margin-top: auto;
            padding-top: 4px;
            user-select: none;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        @media (min-width: 640px) {
            .keyboard-row { gap: 6px; margin-bottom: 6px; }
        }

        .key {
            background: rgba(51, 65, 85, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-bottom: 3px solid rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            min-width: 0;
            flex: 1;
            transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease;
            position: relative;
        }

        @media (min-width: 640px) {
            .key {
                font-size: 0.95rem;
                height: 44px;
                border-radius: 10px;
            }
        }

        .key:active, .key.key-pressed {
            transform: translateY(2px) scale(0.95);
            border-bottom-width: 1px;
        }

        .key.key-correct {
            background: #16a34a !important;
            border-color: #4ade80 !important;
            color: white !important;
        }

        .key.key-wrong {
            background: #dc2626 !important;
            border-color: #f87171 !important;
            color: white !important;
        }

        .key-backspace {
            flex: 1.5;
            background: rgba(127, 29, 29, 0.65);
            border-color: rgba(244, 63, 94, 0.3);
            color: #fecdd3;
            font-size: 0.95rem;
        }

        .key-hint-btn {
            flex: 1.4;
            background: rgba(180, 83, 9, 0.65);
            border-color: rgba(245, 158, 11, 0.35);
            color: #fde68a;
            font-size: 0.78rem;
        }

        /* ===== POWER-UP BAR ===== */
        .powerup-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-powerup {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid var(--border-medium);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 11px;
            font-size: 0.74rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-powerup:hover:not(:disabled) {
            background: var(--bg-elevated);
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .btn-powerup:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .powerup-count {
            background: rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
        }

        /* ===== CLUE BOX ===== */
        .clue-box {
            width: 100%;
            max-width: 560px;
            background: rgba(30, 41, 59, 0.65);
            border-radius: 14px;
            padding: 12px 15px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 10px;
            position: relative;
        }

        @media (min-width: 640px) {
            .clue-box {
                padding: 15px 20px;
                border-radius: 16px;
                margin-bottom: 14px;
            }
        }

        .clue-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .clue-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #60a5fa;
        }

        .topic-pill-mini {
            font-size: 0.64rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.16);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .clue-text {
            font-size: 0.88rem;
            color: var(--text-primary);
            font-weight: 500;
            line-height: 1.5;
        }

        @media (min-width: 640px) {
            .clue-text { font-size: 1rem; }
        }

        .extra-clue-info {
            margin-top: 8px;
            padding-top: 7px;
            border-top: 1px dashed rgba(148, 163, 184, 0.25);
            font-size: 0.75rem;
            color: #fde68a;
            font-weight: 600;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== MENU BUTTONS ===== */
        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        @media (min-width: 540px) {
            .mode-buttons {
                grid-template-columns: 1fr 1fr;
            }
            .mode-buttons .btn-full-span {
                grid-column: span 2;
            }
        }

        .btn-mode {
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.02rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        .btn-mode::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent 60%);
            pointer-events: none;
        }

        .btn-mode:hover { transform: translateY(-2px); }
        .btn-mode:active { transform: scale(0.97); }

        .btn-easy {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.32);
            border: 1px solid rgba(96, 165, 250, 0.4);
        }

        .btn-hard {
            background: linear-gradient(135deg, #e11d48, #be123c);
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.32);
            border: 1px solid rgba(251, 113, 133, 0.4);
        }

        .btn-student {
            background: linear-gradient(135deg, #059669, #0f766e);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.32);
            border: 1px solid rgba(52, 211, 153, 0.45);
        }

        .btn-subtitle {
            font-size: 0.68rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .btn-retry {
            padding: 12px 24px;
            border-radius: 13px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s ease;
            color: white;
            background: linear-gradient(135deg, var(--bg-elevated), var(--bg-surface));
            border: 1px solid var(--border-medium);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-retry:hover { background: #475569; transform: translateY(-1px); }
        .btn-retry:active { transform: scale(0.96); }

        .menu-footer-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
            width: 100%;
        }

        .btn-secondary-nav {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-medium);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-secondary-nav:hover {
            color: white;
            border-color: var(--accent-blue);
            background: rgba(51, 65, 85, 0.85);
        }

        /* ===== HEADER BAR ===== */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            gap: 6px;
        }

        .header-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--accent-amber);
            transition: color 0.3s;
            line-height: 1;
        }

        @media (min-width: 640px) {
            .timer-value { font-size: 1.75rem; }
        }

        .counter-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-emerald);
            line-height: 1;
        }

        .combo-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            margin-top: 3px;
        }

        .combo-badge.fever {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            border-color: #fde68a;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
            animation: pop 0.3s ease;
        }

        /* ===== WORD CONTAINER ===== */
        .word-container {
            width: 100%;

cing senyum manis sekaligus memaksa tumpah air mata tanpa disadari.", "t": "TEKA-TEKI"}, {"w": "NAFAS", "c": "Hembusan tak kasatmata bukti nyawa, yang ditarik buang tanpa lelah puluhan ribu kali sehari tanpa diperintah, saat ia berhenti total manusia berakhir.", "t": "TEKA-TEKI"}, {"w": "KATA", "c": "Susunan vokal konsonan berjejer yang jika terangkai di mulut manusia, bisa berubah menjadi pelukan pereda duka atau senjata tak berdarah paling menggores jiwa.", "t": "TEKA-TEKI"}, {"w": "SURAT", "c": "Pembawa pesan yang berjalan jauh melintasi kota, namun baru mau berbicara setelah kepalanya disobek terlebih dahulu.", "t": "TEKA-TEKI"}, {"w": "PRANGKO", "c": "Benda mungil yang mampu berkeliling dunia dari satu negeri ke negeri lain meski hanya diam menempel di satu sudut.", "t": "TEKA-TEKI"}, {"w": "PENSIL", "c": "Meninggalkan jejak kisah yang panjang di atas lembaran putih, namun tubuhnya sendiri kian memendek setiap kali dipaksa bercerita.", "t": "TEKA-TEKI"}, {"w": "PENGHAPUS", "c": "Pahlawan bisu yang rela tubuhnya terkikis habis sedikit demi sedikit demi menebus kesalahan yang diperbuat temannya.", "t": "TEKA-TEKI"}, {"w": "KEBODOHAN", "c": "Tamu tak diundang yang paling keras kepala, semakin banyak ruang kosong di kepala semakin betah ia bertahta.", "t": "TEKA-TEKI"}, {"w": "APIUNGUN", "c": "Bunga merah menyala yang mekar menghangatkan malam dingin di hutan, namun mati menyisakan arang hitam saat fajar tiba.", "t": "TEKA-TEKI"}, {"w": "EMBUN", "c": "Mutiara bening yang diam-diam diletakkan malam di ujung dedaunan, namun segera dicuri pergi oleh tatapan pertama mentari pagi.", "t": "TEKA-TEKI"}, {"w": "OMBAK", "c": "Barisan prajurit biru yang berlari tanpa lelah menyerbu bibir pantai, hanya untuk hancur berbuih lalu ditarik mundur kembali.", "t": "TEKA-TEKI"}, {"w": "CAHAYA", "c": "Tamu tanpa bobot yang mampu memenuhi seluruh ruangan gelap dalam sekejap mata tanpa mengambil tempat sedikit pun.", "t": "TEKA-TEKI"}, {"w": "KEGELAPAN", "c": "Penguasa sunyi yang tampa ", "c": "Lengkungan kecil tanpa suara di wajah yang tidak membutuhkan biaya, namun mampu menerangi hari orang asing yang sedang mendung.", "t": "TEKA-TEKI"}, {"w": "AIRMATA", "c": "Hujan asin yang turun bukan dari langit mendung, melainkan dari mata manusia ketika hati tak lagi sanggup berkata-kata.", "t": "TEKA-TEKI"}, {"w": "TIDUR", "c": "Saudara kembar kematian yang datang menjemput setiap malam untuk meminjamkan istirahat sebelum dikembalikan esok pagi.", "t": "TEKA-TEKI"}, {"w": "LUKA", "c": "Jejak merah yang menganga saat tergores, sembuh menutup seiring waktu namun menyisakan tanda abadi sebagai pengingat.", "t": "TEKA-TEKI"}, {"w": "POHON", "c": "Makhluk tabah yang berdiri tegak di satu titik seumur hidupnya, membalas lemparan batu manusia dengan menjatuhkan buah manis.", "t": "TEKA-TEKI"}, {"w": "DAUN", "c": "Penari hijau di ujung dahan yang setia menangkap sinar matahari, hingga akhirnya menguning kering dan rela gugur mencium bumi.", "t": "TEKA-TEKI"}, {"w": "BENIH", "c": "Kuburan kecil yang ditanam di dalam tanah gelap, namun justru bangkit memecah cangkangnya menjadi kehidupan baru yang menjulang.", "t": "TEKA-TEKI"}, {"w": "ANGIN", "c": "Pengembara tak kasatmata yang tak pernah bisa kau lihat wajahnya, namun kehadirannya menundukkan pepohonan dan menggerakkan awan.", "t": "TEKA-TEKI"}, {"w": "AWAN", "c": "Kapal kapas raksasa yang berlayar tenang di samudra langit, sebelum berubah kelabu dan menumpahkan seluruh muatan airnya.", "t": "TEKA-TEKI"}, {"w": "KABUT", "c": "Selimut putih dingin yang turun memeluk bukit di pagi buta, menyembunyikan pemandangan sebelum ditiup pergi oleh siang.", "t": "TEKA-TEKI"}, {"w": "GUNUNG", "c": "Raksasa batu yang duduk bersila menembus awan, diam seribu bahasa menyaksikan ribuan generasi manusia datang dan pergi.", "t": "TEKA-TEKI"}, {"w": "SUNGAI", "c": "Ular air panjang yang merayap tanpa pernah menoleh ke belakang, meninggalkan mata air pegunungan demi melebur di lautan.", "t": "TEKA-TEKI"}, {"w": "JEMBATAN", "c": "Pun     let soundEnabled = localStorage.getItem('tkk_sound') !== 'false';
    let audioCtx = null;

    function getAudioCtx() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.12, slideFreq = null) {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            if (slideFreq) {
                osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(gainVal, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch (e) {}
    }

    function sfxKeyCorrect(stepIndex) {
        // Ascending musical scale per letter index
        const baseNotes = [330, 370, 415, 440, 493, 554, 587, 659, 740, 830, 880, 987];
        const freq = baseNotes[stepIndex % baseNotes.length] * (isFeverMode() ? 1.15 : 1);
        playTone(freq, 'triangle', 0.07, 0.11);
    }

    // =========================================================================
    // 3. SISTEM 100% CRYPTO-RANDOM & ANTI-REPEAT (TIDAK AKAN MUNCUL 2-3 KALI)
    // =========================================================================
    function cryptoRandomFloat() {
        if (window.crypto && window.crypto.getRandomValues) {
            const arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            return arr[0] / (0xFFFFFFFF + 1);
        }
        return Math.random();
    }

    function cryptoRandomInt(maxExclusive) {
        return Math.floor(cryptoRandomFloat() * maxExclusive);
    }

    function shuffleArray(array) {
        const arr = [...array];
        // Double pass cryptographic Fisher-Yates shuffle for maximum entropy
        for (let pass = 0; pass < 2; pass++) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = cryptoRandomInt(i + 1);
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }
        return arr;
    }

    function getSeenHistory(poolKey) {
        try {
            return JSON.parse(localStorage.getItem('tkk_seen_v3_' + poolKey)) || [];
        } catch (e) {
            return [];
        }
    }

    function saveSeenHistory(poolKey, list) {
        try {
            localStorage.setItem('tkk_seen_v3_' + poolKey, JSON.stringify(list));
        } catch (e) {}
    }

    function getRecentGlobal() {
        try {
            return JSON.parse(localStorage.getItem('tkk_recent_global_v3')) || [];
        } catch (e) {
            return [];
        }
    }

    function markWordSeen(wordStr, poolKey) {
        if (!wordStr) return;
        const w = wordStr.toUpperCase();
        // 1. Update mode-specific seen list
        const seen = getSeenHistory(poolKey);
        if (!seen.includes(w)) {
            seen.push(w);
            saveSeenHistory(poolKey, seen);
        }
        // 2. Update global recent buffer (last 85 words across ALL games/modes)
        const recent = getRecentGlobal().filter(item => item !== w);
        recent.push(w);
        if (recent.length > 85) {
            recent.splice(0, recent.length - 85);
        }
        try {
            localStorage.setItem('tkk_recent_global_v3', JSON.stringify(recent));
        } catch (e) {}
    }

    // Build a non-repeating queue of unique words for a session
    function buildUniqueWordQueue(sourceDict, count, poolKey, topicFilter = 'ALL', extraExcludeSet = new Set()) {
        // Filter by topic if applicable
        let filteredSource = sourceDict;
        if (topicFilter && topicFilter !== 'ALL') {
            const topicMatches = sourceDict.filter(item => item.t === topicFilter);
            if (topicMatches.length >= Math.min(count, 10)) {
                filteredSource = topicMatches;
            }
        }

        // Ensure 100% unique words in source
        const uniqueMap = new Map();
        for (const item of filteredSource) {
            const w = item.w.toUpperCase();
            if (!uniqueMap.has(w) && !extraExcludeSet.has(w)) {
                uniqueMap.set(w, item);
            }
        }
        const allCandidates = Array.from(uniqueMap.values());

        const seenSet = new Set(getSeenHistory(poolKey));
        const recentGlobalSet = new Set(getRecentGlobal());

        // Priority 1: Words never seen in this mode AND not in global recent 85 words
        let tier1 = shuffleArray(allCandidates.filter(item => !seenSet.has(item.w) && !recentGlobalSet.has(item.w)));

        if (tier1.length >= count) {
            return tier1.slice(0, count);
        }

        // Priority 2: Words never seen in this mode (even if in older global recent)
        const chosenWords = new Set(tier1.map(x => x.w));
        let tier2 = shuffleArray(allCandidates.filter(item => !seenSet.has(item.w) && !chosenWords.has(item.w)));
        let result = [...tier1, ...tier2];

        if (result.length >= count) {
            return result.slice(0, count);
        }

        // If we exhausted the entire dictionary of hundreds of words, reset mode history
        // while STRICTLY excluding words already in `result` AND words in `recentGlobalSet`!
        saveSeenHistory(poolKey, []);
        result.forEach(x => chosenWords.add(x.w));

        let tier3 = shuffleArray(allCandidates.filter(item => !chosenWords.has(item.w) && !recentGlobalSet.has(item.w)));
        result = [...result, ...tier3];

        if (result.length >= count) {
            return result.slice(0, count);
        }

        // Final fallback if count > entire filtered dictionary
        result.forEach(x => chosenWords.add(x.w));
        let tier4 = shuffleArray(allCandidates.filter(item => !chosenWords.has(item.w)));
        return [...result, ...tier4].slice(0, count);
    }

        try {

            if (merged.dailyDate !== today) {

    function recordWordMastered(wordObj) {
        profile.totalWordsSolved++;
        profile.dailyWords++;

        // Update daily streak
        const today = getTodayKey();
        if (profile.lastPlayDate !== today) {
            if (profile.lastPlayDate) {
                const last = new Date(profile.lastPlayDate);
                const now = new Date(today);
                const diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) profile.streakDays++;
                else if (diffDays > 1) profile.streakDays = 1;
            } else {
                profile.streakDays = 1;
            }
            profile.lastPlayDate = today;
        }

        if (profile.dailyWords >= 15 && !profile.dailyClaimed) {
            profile.dailyClaimed = true;
            profile.xp += 150;
            unlockBadge('daily_done');
        }

        if (!profile.masteredWords.some(item => item.w === wordObj.w)) {
            profile.masteredWords.unshift({ w: wordObj.w, c: wordObj.c, t: wordObj.t || 'UMUM' });
            if (profile.masteredWords.length > 500) {
                profile.masteredWords.pop();
            }

        if (profile.totalWordsSolved >= 50) unlockBadge('words_50');

    // =========================================================================
    function startGame(mode) {
        currentMode = mode;
        wordCombo = 0;
        maxSessionCombo = 0;
        sessionXP = 0;
        totalKeystrokes = 0;
        correctKeystrokes = 0;
        sessionHistory = [];
        livesRemaining = 3;

        if (mode === 'easy') {
            TOTAL_WORDS = 10;
            timeLeft = 60;
            maxTimeForBar = 60;
            bonusTime = 3;
            hintsRemaining = 3;
            structureHintsRemaining = 2;
            skipsRemaining = 1;
            targetQuestions = buildUniqueWordQueue(dictionaryEasy, TOTAL_WORDS, 'easy_' + selectedTopic, selectedTopic);
        } else if (mode === 'hard') {
            TOTAL_WORDS = 12;
            timeLeft = 90;
            maxTimeForBar = 90;
            bonusTime = 2;
            hintsRemaining = 2;
            structureHintsRemaining = 2;
            skipsRemaining = 1;
            targetQuestions = buildUniqueWordQueue(dictionaryHard, TOTAL_WORDS, 'hard_' + selectedTopic, selectedTopic);
        } else if (mode === 'student') {
            // Mode Pelajar Marathon: 80 unique escalating words (Easy -> Hard)
            TOTAL_WORDS = 80;
            timeLeft = 25;
            maxTimeForBar = 25;
            bonusTime = 0;
            hintsRemaining = 3;
            structureHintsRemaining = 3;
            skipsRemaining = 2;
            const qEasy = buildUniqueWordQueue(dictionaryEasy, 10, 'student_easy_' + selectedTopic, selectedTopic);
            const usedSet = new Set(qEasy.map(x => x.w));
            const qHard = buildUniqueWordQueue(dictionaryHard, 70, 'student_hard_' + selectedTopic, selectedTopic, usedSet);
            targetQuestions = [...qEasy, ...qHard];
        } else if (mode === 'hell') {
            TOTAL_WORDS = 15;
            timeLeft = 180;
            maxTimeForBar = 180;
            bonusTime = 1;
            hintsRemaining = 1;
            structureHintsRemaining = 1;
            skipsRemaining = 0;
            targetQuestions = buildUniqueWordQueue(dictionaryHell, TOTAL_WORDS, 'hell', 'ALL');
        } else if (mode === 'judgment') {
            TOTAL_WORDS = 20;
            timeLeft = 150;
            maxTimeForBar = 150;
            bonusTime = 0;
            hintsRemaining = 0;
            structureHintsRemaining = 0;
            skipsRemaining = 0;
            const qJudg = buildUniqueWordQueue(dictionaryJudgment, 8, 'judgment_core', 'ALL');
            const excludeSet = new Set(qJudg.map(x => x.w));
            const comboDict = [...dictionaryEasy, ...dictionaryHard, ...dictionaryHell];
            const qMix = buildUniqueWordQueue(comboDict, 12, 'judgment_mix', 'ALL', excludeSet);
            targetQuestions = shuffleArray([...qJudg, ...qMix]);
        }

        currentWordIndex = 0;
        state = 'playing';

        if (mode === 'judgment') {
            document.body.classList.add('shake-screen');
        } else {
            document.body.classList.remove('shake-screen');
        }

        renderGameUI();
        updateTimerDisplay();
        loadWord();

        clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 10 && timeLeft > 0) {
                sfxTickCritical();
            }

            if (currentMode === 'judgment') {
                const timerDisplay = document.getElementById('timer-display');
                if (timerDisplay && cryptoRandomFloat() < 0.12) {
                    timerDisplay.classList.add('timer-fire');
                    setTimeout(() => timerDisplay.classList.remove('timer-fire'), 800);
                }
            }

            if (timeLeft <= 0 && state === 'playing') {
                if (currentMode === 'student' && livesRemaining > 1) {
                    // Lose 1 life and move to next word in Student Marathon
                    livesRemaining--;
                    wordCombo = 0;
                    sfxKeyWrong();
                    sessionHistory.push({ w: currentWord, c: currentClue, t: currentWordTopic, solved: false });
                    updateLivesDisplay();
                    updateComboDisplay();
                    currentWordIndex++;
                    if (currentWordIndex >= targetQuestions.length) {
                        renderResult(true);
                    } else {
                        timeLeft = 25;
                        updateTimerDisplay();
                        loadWord();
                    }
                } else {
                    renderResult(false);
                }
            }
        }, 1000);
    }

    function updateLivesDisplay() {
        const el = document.getElementById('lives-display');
        if (el) {
            el.innerText = '❤️'.repeat(Math.max(0, livesRemaining)) + '🖤'.repeat(Math.max(0, 3 - livesRemaining));
        }
    }

    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('timer-display');
        if (!timerDisplay) return;

        timerDisplay.innerText = formatTime(timeLeft);

        const barFill = document.getElementById('timer-bar-fill');
        if (barFill) {
            const pct = Math.max(0, Math.min(100, (timeLeft / maxTimeForBar) * 100));
            barFill.style.width = pct + '%';
            if (timeLeft <= 10) {
                barFill.style.background = 'linear-gradient(90deg, #ef4444, #f97316)';
            } else if (pct < 40) {
                barFill.style.background = 'linear-gradient(90deg, #f59e0b, #eab308)';
            } else {
                barFill.style.background = 'linear-gradient(90deg, #10b981, #3b82f6)';
            }
        }

        if (timeLeft <= 10) {
            timerDisplay.classList.add('timer-critical');
        } else {
            timerDisplay.classList.remove('timer-critical');
            timerDisplay.style.color = 'var(--accent-amber)';
        }
    }

    function showTimeBonus(extraSec = 0) {
        const totalAdd = bonusTime + extraSec;
        if (currentMode === 'student') {
            timeLeft = 25;
            updateTimerDisplay();
            return;
        }
        if (totalAdd <= 0) return;

        timeLeft += totalAdd;
        if (timeLeft > maxTimeForBar) maxTimeForBar = timeLeft;
        updateTimerDisplay();

        const timerDisplay = document.getElementById('timer-display');
        if (timerDisplay) {
            timerDisplay.style.color = 'var(--accent-emerald)';
            setTimeout(() => {
                if (timeLeft > 10) {
                    timerDisplay.style.color = 'var(--accent-amber)';
                }
            }, 450);
        }

        const anim = document.getElementById('bonus-anim');
        if (anim) {
            anim.innerText = `+${totalAdd}s`;
            anim.style.display = 'block';
            anim.style.animation = 'none';
            void anim.offsetHeight;
            anim.style.animation = 'floatUp 0.95s ease-out forwards';

            setTimeout(() => {
                anim.style.display = 'none';
            }, 950);
        }
    }

    function loadWord() {
        const qObj = targetQuestions[currentWordIndex];
        currentWord = qObj.w.toUpperCase();
        currentClue = qObj.c;
        currentWordTopic = qObj.t || 'UMUM';
        boxIndex = 0;
        currentWordHadError = false;
        extraStructureShown = false;
        wordStartTime = Date.now();

        // Mark this word as seen ONLY when it is actually displayed on screen!
        const poolKey = (currentMode === 'easy' || currentMode === 'hard')
            ? `${currentMode}_${selectedTopic}`
            : currentMode;
        markWordSeen(currentWord, poolKey);

        const counterEl = document.getElementById('word-counter');
        if (counterEl) {
            counterEl.innerText = currentMode === 'student' ? currentWordIndex : (currentWordIndex + 1);
        }

        const lenBadge = document.getElementById('word-len-badge');
        if (lenBadge) lenBadge.innerText = `${currentWord.length} HURUF`;

        const topicBadge = document.getElementById('word-topic-badge');
        if (topicBadge) {
            topicBadge.innerText = TOPIC_META[currentWordTopic] ? TOPIC_META[currentWordTopic].label : currentWordTopic;
        }

        const extraBox = document.getElementById('extra-clue-box');
        if (extraBox) {
            extraBox.style.display = 'none';
            extraBox.innerHTML = '';
        }

        document.getElementById('clue-text').innerText = currentClue;

        const container = document.getElementById('word-container');
        container.innerHTML = '';
        boxElements = [];

        for (let i = 0; i < currentWord.length; i++) {
            const box = document.createElement('div');
            box.className = 'letter-box';
            if (i === 0) box.classList.add('active');
            container.appendChild(box);
            boxElements.push(box);
        }

        updatePowerupButtons();
        updateComboDisplay();
    }

    function flashVirtualKey(letter, isCorrect) {
        const keyEl = document.getElementById('vkey-' + letter);
        if (!keyEl) return;
        const cls = isCorrect ? 'key-correct' : 'key-wrong';
        keyEl.classList.add('key-pressed', cls);
        setTimeout(() => {
            keyEl.classList.remove('key-pressed', cls);
        }, 220);
    }

    // Power-up 1: Buka 1 Huruf (Hint)
    function useLetterHint() {
        if (state !== 'playing' || boxIndex >= currentWord.length) return;
        if (currentMode === 'judgment') {
            if (timeLeft <= 5) return;
            timeLeft -= 5;
            updateTimerDisplay();
        } else {
            if (hintsRemaining <= 0) return;
            hintsRemaining--;
        }

        const targetLetter = currentWord[boxIndex];
        handleKeyClick(targetLetter, true);
        updatePowerupButtons();
    }

    // Power-up 2: Petunjuk Struktur Kata (Huruf Awal, Akhir, Jumlah Vokal)
    function useStructureHint() {
        if (state !== 'playing' || structureHintsRemaining <= 0 || extraStructureShown) return;
        structureHintsRemaining--;
        extraStructureShown = true;
        playTone(600, 'sine', 0.09, 0.1);

        const vowels = (currentWord.match(/[AIUEO]/g) || []).length;
        const firstChar = currentWord[0];
        const lastChar = currentWord[currentWord.length - 1];

        const extraBox = document.getElementById('extra-clue-box');
        if (extraBox) {
            extraBox.style.display = 'flex';
            extraBox.innerHTML = `
                <span>🔤 Awal: <strong>${firstChar}</strong></span>
                <span>🔚 Akhir: <strong>${lastChar}</strong></span>
                <span>🎵 Huruf Vokal: <strong>${vowels}</strong></span>
            `;
        }
        updatePowerupButtons();
    }

    // Power-up 3: Lewati / Ganti Kata Baru
    function useSkipWord() {
        if (state !== 'playing' || skipsRemaining <= 0) return;
        skipsRemaining--;
        playTone(400, 'triangle', 0.1, 0.1);

        // Draw 1 brand new unseen word from the appropriate dictionary
        const dict = currentMode === 'easy' ? dictionaryEasy : dictionaryHard;
        const excludeSet = new Set(targetQuestions.map(x => x.w));
        const replacement = buildUniqueWordQueue(dict, 1, currentMode + '_skip', selectedTopic, excludeSet);
        if (replacement.length > 0) {
            targetQuestions[currentWordIndex] = replacement[0];
        }
        loadWord();
    }

    function handleKeyClick(letter, isFromHint = false) {
        if (state !== 'playing' || boxIndex >= currentWord.length) return;

        const targetLetter = currentWord[boxIndex];
        const currentBox = boxElements[boxIndex];

        totalKeystrokes++;

        currentBox.classList.remove('animate-pop', 'animate-shake');
        void currentBox.offsetWidth;

        currentBox.innerText = letter;

        if (letter === targetLetter) {
            correctKeystrokes++;
            currentBox.classList.remove('active', 'wrong');
            currentBox.classList.add(isFromHint ? 'hinted' : 'correct', 'animate-pop');
            flashVirtualKey(letter, true);
            sfxKeyCorrect(boxIndex);

            boxIndex++;

            if (boxIndex === currentWord.length) {
                // Word Completed!
                const elapsedSec = (Date.now() - wordStartTime) / 1000;
                if (!currentWordHadError) {
                    wordCombo++;
                    if (wordCombo > maxSessionCombo) maxSessionCombo = wordCombo;
                    if (wordCombo > profile.bestCombo) {
                        profile.bestCombo = wordCombo;
                    }
                    if (wordCombo === 5) {
                        sfxFeverActivate();
                        unlockBadge('streak_5');
                    }
                    if (wordCombo >= 10) unlockBadge('streak_10');
                } else {
                    wordCombo = 0;
                }

                if (elapsedSec <= 2.5 && !isFromHint) {
                    unlockBadge('speed_demon');
                }

                const feverBonusSec = (isFeverMode() && currentMode !== 'judgment' && currentMode !== 'student') ? 1 : 0;
                showTimeBonus(feverBonusSec);
                sfxWordComplete();

                // Calculate XP earned
                const baseXP = currentMode === 'easy' ? 15 : (currentMode === 'hard' ? 25 : 30);
                const gainedXP = baseXP * (isFeverMode() ? 2 : 1);
                sessionXP += gainedXP;
                profile.xp += gainedXP;

                const wordObj = targetQuestions[currentWordIndex];
                recordWordMastered(wordObj);
                sessionHistory.push({ w: currentWord, c: currentClue, t: currentWordTopic, solved: true });

                // Floating praise
                if (elapsedSec <= 2.8) {
                    spawnPraiseBadge(`⚡ KILAT! +${gainedXP} XP`);
                } else if (isFeverMode()) {
                    spawnPraiseBadge(`🔥 FEVER x${wordCombo}! +${gainedXP} XP`);
                } else if (!currentWordHadError) {
                    spawnPraiseBadge(`✨ SEMPURNA! +${gainedXP} XP`);
                } else {
                    spawnPraiseBadge(`👍 BENAR! +${gainedXP} XP`);
                }

                updateComboDisplay();

                setTimeout(() => {
                    currentWordIndex++;
                    if (currentMode === 'student') {
                        if (currentWordIndex > profile.bestMarathon) {
                            profile.bestMarathon = currentWordIndex;
                            saveProfile();
                        }
                        if (currentWordIndex >= 15) unlockBadge('student_15');
                    }

                    if (currentWordIndex >= TOTAL_WORDS) {
                        renderResult(true);
                    } else {
                        loadWord();
                    }
                }, 420);
            } else {
                boxElements[boxIndex].classList.add('active');
                updatePowerupButtons();
            }
        } else {
            currentWordHadError = true;
            wordCombo = 0;
            updateComboDisplay();

            currentBox.classList.remove('active');
            currentBox.classList.add('wrong', 'animate-shake');
            flashVirtualKey(letter, false);
            sfxKeyWrong();

            // Mode Pelajar Marathon life penalty on 3rd consecutive wrong key or Hell/Judgment time penalty
            if (currentMode === 'hell' || currentMode === 'judgment') {
                const pen = currentMode === 'hell' ? 2 : 5;
                timeLeft -= pen;
                if (timeLeft < 0) timeLeft = 0;
                updateTimerDisplay();

                const timerDisplay = document.getElementById('timer-display');
                if (timerDisplay) {
                    timerDisplay.style.color = '#e11d48';
                    setTimeout(() => {
                        if (timeLeft > 10) {
                            timerDisplay.style.color = 'var(--accent-amber)';
                        } else {
                            timerDisplay.style.color = '';
                        }
                    }, 300);
                }

                if (timeLeft <= 0 && state === 'playing') {
                    state = 'result';
                    setTimeout(() => {
                        renderResult(false);
                    }, 100);
                }
            }
        }
    }

    function handleBackspaceClick() {
        if (state !== 'playing' || boxIndex >= currentWord.length) return;

        const currentBox = boxElements[boxIndex];
        const bkKey = document.getElementById('vkey-BACKSPACE');
        if (bkKey) {
            bkKey.classList.add('key-pressed');
            setTimeout(() => bkKey.classList.remove('key-pressed'), 120);
        }

        if (currentBox.classList.contains('wrong')) {
            currentBox.innerText = '';
            currentBox.classList.remove('wrong', 'animate-shake');
            currentBox.classList.add('active');
            playTone(280, 'sine', 0.05, 0.07);
        }
    }

    // =========================================================================
    // 8. EVENT LISTENERS (KEYBOARD FISIK & SENTUHAN MOBILE)
    // =========================================================================
    window.addEventListener('keydown', (e) => {
        if (state === 'result' && e.key === 'Enter') {
            e.preventDefault();
            startGame(currentMode);
            return;
        }
        if (state !== 'playing') return;

        if (e.key === 'Tab') {
            e.preventDefault();
            useLetterHint();
            return;
        }

        const key = e.key.toUpperCase();
        if (/^[A-Z]$/.test(key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
            e.preventDefault();
            handleKeyClick(key);
        } else if (key === 'BACKSPACE') {
            e.preventDefault();
            handleBackspaceClick();
        }
    });

    // Prevent zoom on double tap (mobile)
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // Initialize UI
    renderMenu();
</script>
</body>
</html>
